[project]
name = "receipt-tracker"
version = "0.1.0"
description = "Expense tracker based on receipt photos"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.12.0",
    "aiogram>=3.13",
    "aiohttp-socks>=0.10.1",
    "datasets>=4.4.0",
    "fastapi>=0.122.0",
    "opencv-python>=5.0.0.93",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.5",
    "tokenizers>=0.23.0",
    "torch>=2.9.0",
    "transformers>=4.57.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
    "scikit-learn>=1.5",
]
ocr = [
    "pytesseract>=0.3.13",
    "easyocr>=1.7.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "D101",
    "D102",
    "D103",
    "D417",
    "DOC102",
    "DOC201",
]
preview = true
explicit-preview-rules = true

[tool.ruff.lint.per-file-ignores]
"categorize/**/*.py" = ["D101", "D102", "D103", "D417", "DOC102", "DOC201"]
"common/models.py" = ["D101"]
"tests/**/*.py" = ["D101", "D102", "D103", "D417", "DOC102", "DOC201"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = ["pytesseract", "easyocr"]
ignore_missing_imports = true

# Known type errors outside the tests, switched off one error code per module so that
# every other check still runs there. Each one is a task for the module owner: remove
# the override together with the fix.
[[tool.mypy.overrides]]
# matplotlib is used only by the offline report and is not a project dependency.
module = ["matplotlib", "matplotlib.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The tokenizers package has no type annotations.
module = ["categorize.bpe"]
disable_error_code = ["no-untyped-call"]

[[tool.mypy.overrides]]
# The host always has a string default, and the validator is checked by the caller,
# but mypy cannot see either.
module = ["categorize.ollama", "categorize.service"]
disable_error_code = ["union-attr"]

[[tool.mypy.overrides]]
# Ad hoc end-to-end script, run by hand against real receipts.
module = ["e2e_10_receipts"]
disable_error_code = ["no-any-return", "type-arg"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-m 'not slow'"
markers = [
    "slow: requires real OCR engines, model weights or network; excluded from the default run",
]
