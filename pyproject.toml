[project]
name = "receipt-tracker"
version = "0.1.0"
description = "Expense tracker based on receipt photos"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.13",
    "accelerate>=1.12.0",
    "datasets>=4.4.0",
    "fastapi>=0.122.0",
    "pydantic-settings>=2.5",
    "torch>=2.9.0",
    "transformers>=4.57.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
disable_error_code = ["import-untyped"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
