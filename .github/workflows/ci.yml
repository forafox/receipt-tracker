name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Format
            target: format-check
          - name: Lint
            target: lint
          - name: Typecheck
            target: typecheck
          - name: Tests
            target: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: make setup

      - name: Run ${{ matrix.name }}
        run: make ${{ matrix.target }}
